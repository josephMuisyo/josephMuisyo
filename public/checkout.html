<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elite Car Yard | Checkout</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="hero small">
      <h1>Checkout & Payment</h1>
      <p>Cash, bank transfer, cheque, and hire purchase are supported.</p>
      <nav>
        <a href="/">Inventory</a>
        <a href="/selection">Selection</a>
        <a class="active" href="/checkout">Checkout</a>
      </nav>
    </header>

    <main class="container narrow">
      <section class="panel">
        <h2>Complete your purchase</h2>
        <form id="checkoutForm" class="checkout-form">
          <label>
            Selected Car ID
            <input id="carId" type="text" readonly />
          </label>
          <label>
            Payment Method
            <select id="paymentMethod" required>
              <option value="cash">Cash</option>
              <option value="bank transfer">Bank transfer</option>
              <option value="cheque">Cheque</option>
              <option value="hire purchase">Hire purchase</option>
            </select>
          </label>
          <label id="depositField">
            Deposit Percentage (required for hire purchase; minimum 30%)
            <input id="depositPercent" type="number" min="0" max="100" step="1" value="30" />
          </label>
          <button class="primary-btn" type="submit">Submit checkout</button>
        </form>
      </section>

      <section id="checkoutResult" class="panel"></section>
    </main>

    <script src="/js/checkout.js"></script>
  </body>
</html>
